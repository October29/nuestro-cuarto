<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestro cuartito 🌙</title>
    <style>
      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #111;
      }
    </style>
  </head>

  <body>
    <div id="game"></div>

    <div id="ui-layer">
      <div id="connect-panel">
        <div class="connect-row">
          <button id="create-room-btn" type="button">Crear sala</button>
          <input
            id="new-room-name-input"
            type="text"
            maxlength="16"
            placeholder="Nombre (opcional)"
            autocomplete="off"
          />
        </div>
        <div id="my-rooms">
          <h3>Mis salas</h3>
          <ul id="saved-rooms-list"></ul>
          <p class="rooms-note">Olvidar solo la quita de tu libreta; la sala sigue existiendo.</p>
        </div>
        <div class="connect-row">
          <input
            id="room-code-input"
            type="text"
            maxlength="6"
            placeholder="Código de sala"
            autocomplete="off"
            autocapitalize="characters"
          />
          <button id="join-room-btn" type="button" disabled>Unirse</button>
        </div>
        <div id="room-code-display" hidden>
          Sala: <span id="room-code-text"></span>
        </div>
        <div id="connection-status" class="status-idle">desconectado</div>
        <div id="peer-status" class="peer-status" hidden></div>
        <div id="connection-error" hidden></div>
        <button id="disconnect-btn" type="button" hidden>Salir de la sala</button>
      </div>

      <div id="room-name-panel" hidden>
        <span id="room-name-display"></span>
        <button id="room-name-edit-btn" type="button" title="Editar nombre">✎</button>
        <div id="room-name-edit-form" hidden>
          <input
            id="room-name-edit-input"
            type="text"
            maxlength="16"
            autocomplete="off"
          />
          <button id="room-name-save-btn" type="button">Guardar</button>
          <button id="room-name-cancel-btn" type="button">Cancelar</button>
        </div>
      </div>

      <div id="chat-panel" hidden>
        <div id="chat-messages"></div>
        <div class="chat-row">
          <input
            id="chat-input"
            type="text"
            maxlength="200"
            placeholder="Mensaje (Enter para enviar, Escape para volver al juego)"
            autocomplete="off"
          />
          <button id="chat-send-btn" type="button">Enviar</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
