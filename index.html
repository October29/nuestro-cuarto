<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestro cuartito 🌙</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="room">
      <div class="window">
        <div class="moon">🌙</div>
        <div class="stars">✦　·　✧　　·　✦　·</div>
      </div>

      <div class="picture interactive" data-object="picture">🖼️</div>

      <div class="shelf interactive" data-object="shelf">📚　📚　🧸　📚</div>

      <div class="tv interactive" data-object="tv">
        <div class="screen">
          <span>OUR LITTLE ROOM</span>
        </div>
      </div>

      <div class="sofa interactive" data-object="sofa">🛋️</div>

      <div class="plant interactive" data-object="plant">🪴</div>

      <div class="rug"></div>

      <section class="controls">
        <button type="button">🎙️</button>
        <button type="button">📷</button>
        <button type="button">🖥️</button>
        <button type="button">💬</button>
      </section>

      <div id="interaction-message" class="interaction-message"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
